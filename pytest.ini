[pytest]
# Without this, `pytest tests/` can't resolve `from core.hooks import ...`
# etc., because tests/ has no __init__.py and pytest's default import mode
# only adds the *test* directory to sys.path, not the repo root. This adds
# the repo root (where pytest.ini lives) instead, so `pytest` and
# `pytest tests/ -v` both just work with no PYTHONPATH gymnastics.
pythonpath = .
testpaths = tests
